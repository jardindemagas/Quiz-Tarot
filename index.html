<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quiz del Mazo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<style>
/* Una pregunta por pantalla; tarjeta central con arco dorado y logo de la marca; resultado con mazo principal y dos alternativas */
:root{
  --bg:#f9f6e8; --surface:#fdfbf1; --fg:#223c24; --muted:#56644f; --line:#c9c2a8;
  --accent:#223c24; --accent-fg:#f9f6e8; --gold:#b0990c; --gold-text:#7f6d06; --sel:#ece7cf;
  --logo-filter:none;
  --display:'EB Garamond',Georgia,'Times New Roman',serif; --body:'EB Garamond',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a13; --surface:#19241a; --fg:#f3efdb; --muted:#b3baa5; --line:#34432f;
  --accent:#f3efdb; --accent-fg:#16241a; --gold:#d3bd3c; --gold-text:#d3bd3c; --sel:#243322;
  --logo-filter:brightness(0) invert(.93); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a13; --surface:#19241a; --fg:#f3efdb; --muted:#b3baa5; --line:#34432f;
  --accent:#f3efdb; --accent-fg:#16241a; --gold:#d3bd3c; --gold-text:#d3bd3c; --sel:#243322;
  --logo-filter:brightness(0) invert(.93); color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1.2rem;line-height:1.5;padding-inline:16px;padding-block:28px}
main{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2.3rem,9vw,3.2rem)}
h2{font-size:clamp(1.7rem,6.5vw,2.2rem)}
p{margin:0}
.eyebrow{font-style:italic;font-size:1.15rem;color:var(--gold-text);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
button{font:inherit;cursor:pointer}
.opt{text-align:left;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:0;line-height:1.35}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--sel);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn{background:var(--accent);color:var(--accent-fg);border:1px solid var(--accent);border-radius:999px;padding:11px 28px;font-weight:600;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);transition:width .25s}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:1rem;border:1px solid var(--line);border-radius:999px;padding:2px 14px;color:var(--muted)}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.alt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.alt h3{font-size:1.5rem}
.note{border-left:2px solid var(--gold);padding-left:14px;font-size:1.05rem;color:var(--muted)}
a.link{color:var(--fg);font-weight:600;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
.num{font-variant-numeric:tabular-nums}
#theme{align-self:flex-end;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 14px;font-size:.95rem}
.arch{width:min(210px,58%);aspect-ratio:1/1.12;align-self:center;border:2px solid var(--gold);border-radius:999px 999px 0 0;display:flex;align-items:flex-end;justify-content:center;padding:26px 14px 8px;box-sizing:border-box}
.arch img{max-width:100%;max-height:100%;object-fit:contain;filter:var(--logo-filter)}
.star{display:flex;align-items:center;gap:14px;color:var(--gold)}
.star:before,.star:after{content:"";height:1px;background:var(--line);flex:1}
.intro{align-items:center;text-align:center}
.intro .eyebrow,.intro p{max-width:30em}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

  d:'Lee la naturaleza como lenguaje simbólico y te lleva a confiar en tu intuición. Mantiene la base Rider-Waite-Smith, y su guía trae tiradas para quienes empiezan. Sus fondos tienen tonos cálidos de atardecer.'},
 sw:{n:'Sacred Witch Tarot',u:STORE+'kit-sacred-witch-tarot-wyspell-zld46/',t:['Gótico','Poder personal','Rider-Waite-Smith'],
  d:'Toma a la bruja como arquetipo de poder propio. Respeta la estructura Rider-Waite-Smith con un lenguaje de magia y saberes ancestrales. Su arte gótico va en azul nocturno, gris piedra y cobre.'}
};
// max = cuántas respuestas se pueden elegir
const Q=[
 {q:'¿Cómo es tu relación con el tarot hoy?',max:1,hint:'Elige una',o:[
  ['Estoy empezando desde cero',{nf:3,ws:3,wr:3,mu:2,th:2,ls:2,pa:2,sw:1,evs:1,sh:-3,up:-3}],
  ['Ya hago lecturas y quiero practicar',{th:2,ls:2,mu:2,ws:2,pa:2,wr:2,sw:2,nf:1,up:1,ev:1,evs:1}],
  ['Hago lecturas avanzadas y busco mazos que me den otra mirada',{up:3,sh:3,ev:2,evs:2,sw:2,ls:2,th:1,pa:1,wr:1}],
  ['Colecciono mazos',{ev:3,evs:3,sh:3,sw:2,ws:1,up:1,mu:1,pa:1}]]},
 {q:'¿Qué tipo de imagen te atrae?',max:99,hint:'Puedes elegir más de una',o:[
  ['Ilustración moderna y cercana, con personas diversas',{th:3,up:3,ls:2}],
  ['Fantasía en acuarela, con criaturas y hadas',{sh:3}],
  ['Art Nouveau con mucho detalle',{ev:3,evs:3}],
  ['Colorida, boho y femenina',{mu:3,ws:3,nf:1}],
  ['Gótica y misteriosa',{sw:3}],
  ['Mitología clásica',{pa:3}]]},
 {q:'¿Qué quieres trabajar con tu mazo?',max:2,hint:'Elige hasta dos',o:[
  ['Autoconocimiento',{th:3,up:3,wr:1,nf:1,ls:1}],
  ['Despertar mi intuición',{wr:3,mu:3,ws:3,th:1,nf:1}],
  ['Lecturas a terceros',{ls:3,th:2,pa:2,sw:2,evs:2,wr:1}]]}
];
const $=id=>document.getElementById(id);
let i=0, ans=[];
function show(s){['intro','quiz','result'].forEach(k=>$(k).hidden=k!==s);window.scrollTo(0,0)}
function render(){
  const q=Q[i]; ans[i]=ans[i]||[];
  $('count').textContent='Pregunta '+(i+1)+' de '+Q.length;
  $('pct').textContent=q.hint;
  $('fill').style.width=(i/Q.length*100)+'%';
  $('q').textContent=q.q;
  $('opts').replaceChildren();
  q.o.forEach((o,k)=>{
    const b=document.createElement('button');
    b.type='button';b.className='opt';b.textContent=o[0];
    b.setAttribute('aria-pressed',ans[i].includes(k));
    b.onclick=()=>{
      const a=ans[i], at=a.indexOf(k);
      if(at>=0)a.splice(at,1);
      else{a.push(k);if(a.length>q.max)a.shift()}
      render()};
    $('opts').appendChild(b);
  });
  $('next').disabled=ans[i].length===0;
  $('next').textContent=i===Q.length-1?'Ver mi mazo':'Siguiente';
  $('back').hidden=i===0;
}
function score(){
  const s=Object.fromEntries(Object.keys(DECKS).map(k=>[k,0]));
  s.ev=0;s.evs=0;
  ans.forEach((sel,qi)=>sel.forEach(a=>{const w=Q[qi].o[a][1];for(const k in w)s[k]+=w[k]}));
  s.eth=Math.max(s.ev,s.evs);delete s.ev;delete s.evs;
  return Object.entries(s).sort((a,b)=>b[1]-a[1]);
}
function copy(t,btn){
  try{navigator.clipboard.writeText(t).then(()=>{btn.textContent='Copiado'},()=>{})}catch(e){}
}
function result(){
  const r=score(), top=DECKS[r[0][0]], alts=r.slice(1,3).map(x=>DECKS[x[0]]);
  const msg='Hola, hice el quiz de Jardín de Magas y me salió '+top.n+'. ¿Me cuentan más del kit?';
  const el=$('result');
  el.innerHTML='';
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="eyebrow">Tu mazo</span><h2></h2><div class="tags"></div><p></p>';
  c.querySelector('h2').textContent='Kit de Iniciación '+top.n;
  top.t.forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent=t;c.querySelector('.tags').appendChild(s)});
  c.querySelector('p').textContent=top.d;
  const call=document.createElement('p');call.className='muted';
  call.textContent='Tu kit llega con una llamada de bienvenida de 20 minutos con nuestro equipo, para que conectes con tu mazo desde la primera tirada.';
  c.appendChild(call);
  const row=document.createElement('div');row.className='row';
  (top.links||[['Ver el kit en la tienda',top.u]]).forEach(l=>{const a=document.createElement('a');a.className='btn';a.target='_blank';a.rel='noopener';a.href=l[1];a.textContent=l[0];row.appendChild(a)});
  row.style.justifyContent='flex-start';
  c.appendChild(row);
  const w=document.createElement('div');w.className='note';
  w.append('¿Dudas? Escríbenos por WhatsApp al ');
  const st=document.createElement('strong');st.className='num';st.textContent=WA_TXT;w.appendChild(st);w.append('. ');
  const wa=document.createElement('a');wa.className='link';wa.target='_blank';wa.rel='noopener';wa.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);wa.textContent='Abrir WhatsApp';
  const cb=document.createElement('button');cb.type='button';cb.className='btn ghost';cb.style.marginLeft='8px';cb.textContent='Copiar mensaje';cb.onclick=()=>copy(msg,cb);
  w.appendChild(wa);w.appendChild(cb);c.appendChild(w);
  el.appendChild(c);
  const h=document.createElement('h3');h.textContent='También podrían gustarte';h.style.margin='24px 0 12px';el.appendChild(h);
  const g=document.createElement('div');g.className='alts';
  alts.forEach(d=>{const x=document.createElement('div');x.className='alt';
    x.innerHTML='<h3></h3><p class="muted"></p>';
    x.querySelector('h3').textContent=d.n;x.querySelector('p').textContent=d.t.join(' · ');
    (d.links||[['Ver en la tienda',d.u]]).forEach(l=>{const a=document.createElement('a');a.className='link';a.target='_blank';a.rel='noopener';a.href=l[1];a.textContent=l[0];x.appendChild(a)});g.appendChild(x)});
  el.appendChild(g);
  const rs=document.createElement('button');rs.type='button';rs.className='btn ghost';rs.textContent='Repetir el quiz';rs.style.marginTop='20px';
  rs.onclick=()=>{i=0;ans=[];show('quiz');render()};el.appendChild(rs);
  show('result');
}
$('start').onclick=()=>{show('quiz');render()};
$('next').onclick=()=>{if(i<Q.length-1){i++;render()}else result()};
$('back').onclick=()=>{if(i>0){i--;render()}};
$('theme').onclick=()=>{const d=document.documentElement;const dark=getComputedStyle(d).colorScheme.includes('dark');d.setAttribute('data-theme',dark?'light':'dark')};
</script>

</body></html>
